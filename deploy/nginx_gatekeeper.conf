# Rate Limiting Zone for Gatekeeper Middleware
limit_req_zone $binary_remote_addr zone=gatekeeper_limit:10m rate=50r/s;

upstream gatekeeper_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is configured)
    # return 301 https://$host$request_uri;

    # Client payload bounds for transaction intents
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Public health check (No rate-limit penalty)
    location /health {
        proxy_pass http://gatekeeper_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # Protected API Gateway
    location / {
        limit_req zone=gatekeeper_limit burst=20 nodelay;

        proxy_pass http://gatekeeper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive timeouts for sub-millisecond execution
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
