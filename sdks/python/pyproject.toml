[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatekeeper-solana"
version = "0.1.0"
description = "Deterministic Pre-Flight Transaction Security & Firewall SDK for Solana AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gatekeeper Contributors" }
]
keywords = [
    "solana",
    "ai-agents",
    "middleware",
    "preflight",
    "mev",
    "firewall",
    "jupiter",
    "raydium",
    "sendai",
    "elizaos"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://gk.ai-futures-bot.pro"
Documentation = "https://github.com/nagysven/GateKeeper-Solana#readme"
Repository = "https://github.com/nagysven/GateKeeper-Solana"
Issues = "https://github.com/nagysven/GateKeeper-Solana/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper_solana", "src/gatekeeper_py"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]
